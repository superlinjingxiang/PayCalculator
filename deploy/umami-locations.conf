# Include inside the PayTools server block only after the private Umami backend
# is healthy. The dashboard and authentication APIs are never public proxies.
location = /analytics/script.js {
    if ($request_method != GET) { return 405; }
    access_log off;
    set $args "";
    proxy_pass http://127.0.0.1:3001/script.js;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location = /analytics/api/send {
    if ($request_method != POST) { return 405; }
    client_max_body_size 16k;
    access_log off;
    set $args "";
    proxy_pass http://127.0.0.1:3001/api/send;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Referer "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header Fastly-Client-IP "";
    proxy_set_header X-NF-Client-Connection-IP "";
    proxy_set_header DO-Connecting-IP "";
    proxy_set_header X-Vercel-Forwarded-For "";
    proxy_set_header X-Client-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control no-store always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location ^~ /analytics/ {
    return 404;
}
