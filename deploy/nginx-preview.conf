user nginx;
worker_processes auto;
pid /run/paytools-nginx.pid;
error_log /var/log/paytools/error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    access_log off;
    # Only these endpoints resolve to a page. Never log request_uri or args.
    map $uri $pv_page {
        default "";
        /__pv/home /;
        /__pv/calculator /salary-calculator/;
        /__pv/shanghai /shanghai-salary-calculator/;
        /__pv/methodology /methodology/;
        /__pv/policies /policy-sources/;
        /__pv/privacy /privacy/;
        /__pv/about /about/;
    }
    map "$request_method:$status:$pv_page" $pv_success {
        default 0;
        ~^GET:204:/ 1;
    }
    log_format pv_only '$time_iso8601\t$pv_page';
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    server {
        listen 80;
        server_name _;
        root /srv/paytools/current;
        index index.html;
        error_page 404 /404.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location /__pv/ {
            # add_header is not inherited after a location defines its own headers.
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-store" always;
            access_log /var/log/paytools/pv/pageviews.log pv_only if=$pv_success;
            if ($request_method != GET) { return 405; }
            if ($pv_page = "") { return 404; }
            return 204;
        }
        location /_next/static/ {
            expires 1y;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
