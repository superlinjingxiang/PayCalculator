name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Install Nginx for isolated PV integration
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
      - run: npm run test:pv
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_PV_ENABLED: 'true'
          NEXT_PUBLIC_ADS_ENABLED: 'false'
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_PV_ENABLED: 'true'
      - name: Build isolated Umami tracker test preview
        run: npm run build
        env:
          NEXT_PUBLIC_ANALYTICS_PROVIDER: umami
          NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: a45801cb-c783-403d-972f-c95f412d4a77
          NEXT_PUBLIC_PV_ENABLED: 'false'
          NEXT_PUBLIC_ADS_ENABLED: 'false'
      - run: npx playwright test tests/e2e/analytics.spec.ts
        env:
          NEXT_PUBLIC_ANALYTICS_PROVIDER: umami
